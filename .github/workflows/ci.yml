name: Dashboard checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: RE2_DOWNLOAD_FORCE_BUILD=1 npm exec --yes --package=pnpm@11.25.0 -- pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firebase, reports and Google integration
        run: npm run test:emulators
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build dashboard
        run: npm run build
